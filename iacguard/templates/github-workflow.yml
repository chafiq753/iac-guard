# iac-guard: security scan on every pull request.
# To block the merge when the scan fails:
#   Settings > Rules > Rulesets > New branch ruleset > target: default branch
#   > "Require status checks to pass" > add the "iac-guard" check.
name: iac-guard

on:
  pull_request:
  push:
    branches: [__BRANCH__]

permissions:
  contents: read
  security-events: write    # alerts in Security > Code scanning

jobs:
  iac-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Gitleaks reads the Git history

      - uses: chafiq753/iac-guard@__REF__
        with:
          upload-sarif: true      # threshold, exclusions, exceptions: .iacguard.yml

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iacguard-report
          path: iacguard-report.json
