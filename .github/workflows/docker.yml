# Construit l'image de l'outil, la teste, puis la publie sur ghcr.io :
#   branche tool/main -> ghcr.io/chafiq753/iacguard:tool (ou :main)
#   tag v1.2.3        -> :1.2.3, :1 et :latest
name: Image Docker

on:
  push:
    branches: [main, tool]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - "iacguard/**"
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/iacguard

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iacguard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # On ne publie que ce qui marche : l'image doit trouver les failles du
      # Terraform de démo et sortir en code 1.
      - name: Tester l'image
        run: |
          docker run --rm iacguard:test --version
          docker run --rm iacguard:test doctor
          mkdir demo && cp docs/demo-vulnerable-main.tf demo/main.tf
          set +e
          docker run --rm -v "$PWD/demo:/src:ro" iacguard:test scan /src --tools gitleaks,checkov
          code=$?
          set -e
          echo "code de sortie : $code"
          test "$code" -eq 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
