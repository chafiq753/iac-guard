# =============================================================================
#  iac-guard — Scan de sécurité & conformité IaC
#
#  À COPIER dans le repo Terraform du client : .github/workflows/scan.yml
#
#  Prérequis côté client (une seule fois, dans GitHub) :
#    Settings > Secrets and variables > Actions
#      - Secret   IACGUARD_TOKEN    = le token du projet (iacg_...)
#      - Variable IACGUARD_API_URL  = l'URL de ton API (ex: https://api.iac-guard.ma)
#
#  Ce workflow se déclenche à chaque push / pull request, ou à la main
#  (onglet Actions > « Run workflow »). Il :
#    1. lance Gitleaks, Checkov, Conftest et Semgrep,
#    2. normalise leurs résultats (aggregator),
#    3. les envoie à l'API iac-guard.
# =============================================================================

name: iac-guard scan

on:
  workflow_dispatch:      # bouton « Run workflow » dans l'onglet Actions
  push:
  pull_request:

# Versions épinglées (modifiables au même endroit).
env:
  GITLEAKS_VERSION: "8.21.2"
  CONFTEST_VERSION: "0.56.0"
  SEMGREP_VERSION: "1.78.0"
  # Où récupérer l'aggregator et les policies (TON repo iac-guard, public).
  # Remplace ORG/iac-guard par le vrai chemin de ton dépôt.
  IACGUARD_RAW: "https://raw.githubusercontent.com/ORG/iac-guard/main"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------ #
      # 1. Récupérer le code Terraform du client
      # ------------------------------------------------------------------ #
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet -> Gitleaks scanne aussi les commits

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------ #
      # Vérifier que l'API répond AVANT de lancer les scanners : mieux vaut
      # échouer ici, avec un message clair, qu'après 3 minutes de scan.
      # ------------------------------------------------------------------ #
      - name: Vérifier que l'API est joignable
        env:
          RAW_API_URL: ${{ vars.IACGUARD_API_URL }}
        run: |
          # Un copier-coller depuis Windows colle facilement un \r\n invisible
          # à la fin de la variable : on nettoie espaces et retours à la
          # ligne, puis on retire un éventuel / final.
          API_URL="$(printf '%s' "$RAW_API_URL" | tr -d '[:space:]' | sed 's:/*$::')"
          if [ -z "$API_URL" ]; then
            echo "::error::La variable IACGUARD_API_URL n'est pas définie."
            exit 1
          fi
          curl -fsS --max-time 20 "$API_URL/health" \
            || { echo "::error::API injoignable ($API_URL). Tunnel arrêté ou URL périmée ?"; exit 1; }

      # ------------------------------------------------------------------ #
      # 2. Les 4 scanners. `continue-on-error: true` : un scanner qui trouve
      #    des problèmes (et sort en erreur) ne doit PAS bloquer le workflow ;
      #    on veut collecter tous les résultats, pas s'arrêter au premier.
      # ------------------------------------------------------------------ #
      - name: Gitleaks (secrets)
        continue-on-error: true
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . \
            --report-format json --report-path gitleaks.json \
            --redact --exit-code 0

      - name: Checkov (mauvaises configurations)
        continue-on-error: true
        run: |
          pip install checkov
          # --soft-fail : sort en 0 même si des checks échouent
          checkov -d . -o json --soft-fail > checkov.json

      - name: Conftest (règles métier / policies)
        continue-on-error: true
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
          # Récupère les policies Rego iac-guard
          mkdir -p iacguard-policies
          curl -sSL "${IACGUARD_RAW}/policies/bundle.tar.gz" | tar -xz -C iacguard-policies || true
          # Scanne les fichiers .tf (parser HCL2). || true : ne bloque pas.
          conftest test . --parser hcl2 --policy iacguard-policies \
            --all-namespaces -o json > conftest.json || true

      - name: Semgrep (SAST — code applicatif)
        continue-on-error: true
        run: |
          pip install "semgrep==${SEMGREP_VERSION}"
          # --config=auto : jeu de règles Semgrep Registry adapté aux langages détectés.
          semgrep scan --config=auto --json --output semgrep.json || true

      # ------------------------------------------------------------------ #
      # 3. Aggregator : normalise les 4 rapports et POST à l'API
      # ------------------------------------------------------------------ #
      - name: Agréger et envoyer à iac-guard
        run: |
          curl -sSL "${IACGUARD_RAW}/pipeline/aggregator/schema.py"        -o schema.py
          curl -sSL "${IACGUARD_RAW}/pipeline/aggregator/aggregator.py"    -o aggregator.py
          curl -sSL "${IACGUARD_RAW}/pipeline/aggregator/requirements.txt" -o requirements.txt
          pip install -r requirements.txt
          python aggregator.py \
            --gitleaks gitleaks.json \
            --checkov  checkov.json \
            --conftest conftest.json \
            --semgrep  semgrep.json \
            --repo   "${GITHUB_REPOSITORY}" \
            --branch "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --api-url "${{ vars.IACGUARD_API_URL }}" \
            --token   "${{ secrets.IACGUARD_TOKEN }}"
