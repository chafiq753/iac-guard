[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Le nom « iacguard » est déjà pris sur PyPI par un autre projet : le package
# s'appelle iacguard-cli, mais la commande et le module restent `iacguard`.
name = "iacguard-cli"
dynamic = ["version"]
description = "Security scanner for Infrastructure as Code: Gitleaks, Checkov and Semgrep in one report, with a score and a pass/fail verdict that can block pull requests."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chafiq Boulghallat", email = "cboulghallat@gmail.com" }]
keywords = [
    "security", "devsecops", "infrastructure-as-code", "iac", "terraform",
    "kubernetes", "checkov", "gitleaks", "semgrep", "sast", "secrets",
    "sarif", "github-actions", "ci",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/chafiq753/iac-guard"
Documentation = "https://github.com/chafiq753/iac-guard#readme"
Source = "https://github.com/chafiq753/iac-guard"
Issues = "https://github.com/chafiq753/iac-guard/issues"
Changelog = "https://github.com/chafiq753/iac-guard/releases"
"Docker image" = "https://github.com/chafiq753/iac-guard/pkgs/container/iacguard"

[project.scripts]
iacguard = "iacguard.cli:app"

[project.optional-dependencies]
# pip install "iacguard-cli[scanners]" : installe aussi Checkov et Semgrep
# (Gitleaks est un binaire, à installer à part).
scanners = ["checkov", "semgrep"]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "iacguard.__version__" }

[tool.setuptools.packages.find]
include = ["iacguard*"]

[tool.setuptools.package-data]
iacguard = ["templates/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: lance un vrai scanner (sauté s'il n'est pas installé)",
]
