[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iacguard"
dynamic = ["version"]
description = "Scanner DevSecOps pour Infrastructure as Code : secrets, mauvaises configurations et vulnérabilités dans un seul rapport, avec score et blocage de pull request."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Chafiq Boulghallat" }]
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.scripts]
iacguard = "iacguard.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "iacguard.__version__" }

[tool.setuptools.packages.find]
include = ["iacguard*"]

[tool.setuptools.package-data]
iacguard = ["templates/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: lance un vrai scanner (sauté s'il n'est pas installé)",
]
