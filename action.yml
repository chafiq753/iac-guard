name: "iac-guard Security Scan"
description: "Scan IaC repos with Gitleaks, Checkov and Semgrep: one report, a 0-100 score and a verdict that blocks risky PRs."
author: "Chafiq Boulghallat"
branding:
  icon: "shield"
  color: "green"

# Usage, in a repository workflow:
#
#   - uses: actions/checkout@v4
#     with:
#       fetch-depth: 0            # Gitleaks reads the whole Git history
#   - uses: chafiq753/iac-guard@v1
#     with:
#       fail-on: high
#
# The job fails when an issue reaches `fail-on`: make this job a required
# status check (branch protection / ruleset) to disable the Merge button.

inputs:
  path:
    description: "Directory to scan, relative to the repository root."
    default: "."
  fail-on:
    description: >-
      Lowest severity that fails the scan: critical, high, medium, low, info or none.
      Empty: the value from .iacguard.yml, otherwise high.
    default: ""
  tools:
    description: "Scanners to run, comma-separated. Empty: .iacguard.yml, otherwise all three."
    default: ""
  strict:
    description: "Fail if a scanner could not run (true/false)."
    default: "true"
  report:
    description: "File to write the JSON report to."
    default: "iacguard-report.json"
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub Code scanning (Security tab, alerts in
      the PR, no limit on the number of alerts). The workflow needs
      `permissions: security-events: write`. Free for public repositories.
    default: "false"
  sarif:
    description: "File to write the SARIF report to."
    default: "iacguard.sarif"
  gitleaks-version:
    description: "Gitleaks version to install."
    default: "8.21.2"

outputs:
  score:
    description: "Score from 0 to 100."
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: "Grade from A to F."
    value: ${{ steps.scan.outputs.grade }}
  blocked:
    description: "true if the scan blocks."
    value: ${{ steps.scan.outputs.blocked }}
  findings:
    description: "Total number of issues."
    value: ${{ steps.scan.outputs.findings }}
  report:
    description: "Path of the JSON report."
    value: ${{ inputs.report }}
  sarif:
    description: "Path of the SARIF report."
    value: ${{ inputs.sarif }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Isolated environment: the Checkov/Semgrep dependencies don't mix with
    # the user's project dependencies.
    - name: Install iac-guard and the scanners
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        VENV="$RUNNER_TEMP/iacguard-venv"
        python -m venv "$VENV"
        "$VENV/bin/pip" install --quiet --upgrade pip
        "$VENV/bin/pip" install --quiet "$ACTION_PATH" checkov semgrep
        echo "$VENV/bin" >> "$GITHUB_PATH"

        mkdir -p "$RUNNER_TEMP/bin"
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Check the scanners
      shell: bash
      run: iacguard doctor || true

    - name: iac-guard scan
      id: scan
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_TOOLS: ${{ inputs.tools }}
        IN_STRICT: ${{ inputs.strict }}
        IN_REPORT: ${{ inputs.report }}
        IN_SARIF: ${{ inputs.sarif }}
        IN_UPLOAD: ${{ inputs.upload-sarif }}
      # Inputs go through environment variables, never straight into the
      # script: no command injection possible.
      run: |
        set -uo pipefail
        args=(scan "$IN_PATH" -f json -o "$IN_REPORT" --sarif "$IN_SARIF")
        # Empty input = let .iacguard.yml decide (otherwise the action would
        # always override the repository config).
        if [ -n "$IN_FAIL_ON" ]; then args+=(--fail-on "$IN_FAIL_ON"); fi
        if [ -n "$IN_TOOLS" ]; then args+=(--tools "$IN_TOOLS"); fi
        if [ "$IN_STRICT" = "true" ]; then args+=(--strict); fi
        # With Code scanning, alerts already show up in the PR:
        # no duplicate annotations.
        if [ "$IN_UPLOAD" = "true" ]; then args+=(--no-annotations); fi
        iacguard "${args[@]}"

    # Runs even when the scan blocked (that's exactly when the alerts matter).
    # An upload failure (missing permission, private repo without GitHub
    # Advanced Security) does not hide the scan verdict.
    - name: Upload SARIF to GitHub Code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif }}
        category: iac-guard
